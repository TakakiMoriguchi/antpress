# 開発用 PostgreSQL。本番は Supabase（東京リージョン）。
#
# ⚠️ name を必ず明示すること。
#    このディレクトリ名は "app" という汎用的な名前なので、name を省略すると
#    Compose のプロジェクト名が "app" になり、無関係な別プロジェクトの
#    コンテナ（過去の django_app など）を掴んで再作成・削除しようとする。
#
# ⚠️ ポートは 5433。5432 は別プロジェクトが使用しているため。
# ⚠️ image のメジャーバージョンは Supabase 側と揃えること。
#    ローカルと本番で Postgres のバージョンが違うと「ローカルでは動くが本番で落ちる」
#    が起きる。Supabase プロジェクト作成後にバージョンを確認して合わせる。
name: antpress

services:
  db:
    image: postgres:17-alpine
    container_name: antpress-dev-db  # antpress-db は別プロジェクト（../api）が使用中
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: antpress_dev
    ports:
      - "5433:5432"
    volumes:
      - antpress_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d antpress_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  antpress_pgdata:
